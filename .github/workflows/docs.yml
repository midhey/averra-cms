# Сайт документации (apps/docs) → GitHub Pages: https://midhey.github.io/averra-cms/
# Выкладывается при пуше в master, если поменялось то, из чего он собирается, и вручную.
# Сборка здесь та же, что в pnpm check, с проверкой ссылок: битый сайт на Pages не уедет, даже
# если попал в master (пушим прямо в master, ci.yml проверяет уже после пуша).
# В настройках репозитория: Settings → Pages → Source — GitHub Actions
name: docs

on:
  push:
    branches: [master]
    paths:
      - apps/docs/**
      - package.json
      - .npmrc
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

# Одна выкладка за раз. Начатую не отменяем: Pages не любит оборванный деплой
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Токен в .git не оставляем: дальше идёт чужой код сборки (Astro, Starlight, плагины)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - run: corepack enable && corepack prepare pnpm@12.9.1 --activate
      - run: pnpm install --frozen-lockfile --filter "@averra/docs..."
      - run: pnpm docs:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    # Только то, что нужно deploy-pages: создать выкладку и подтвердить, откуда она
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
