# Выпуск версии: тег vX.Y.Z → проверки → образы api и web в GHCR с этой версией.
# Тег ставит release-please и сразу вызывает этот workflow (release-please.yml, workflow_call):
# пуш тега от GITHUB_TOKEN workflow не запускает, поэтому на теги он и не подписан. Вручную —
# пересобрать образы уже выпущенной версии (Actions → release → Run workflow).
# На VPS клиента образы скачивает install.sh (docker compose pull) по AVERRA_VERSION из .env.
# Видимость пакета GHCR от репозитория не наследуется: первый пуш создаёт закрытый пакет. После
# первого релиза владелец один раз делает averra-api и averra-web публичными (Package settings →
# Change visibility → Public) — дальше серверы скачивают образы без входа и без токена. Обратно
# закрытым публичный пакет не сделать.
#
# Сторонние actions закреплены по SHA коммита (в комментарии — версия): тег можно передвинуть,
# коммит — нет. Обновлять — вместе с SHA
name: release

on:
  workflow_call:
    inputs:
      tag:
        description: Тег версии, например v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Тег уже выпущенной версии, например v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      # Node — та, что закреплена в проекте (devEngines.runtime), а не та, что на раннере:
      # pnpm 12 и ключи подписи corepack нужны свежие
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      # pnpm — из packageManager корневого package.json
      - run: corepack enable && corepack prepare pnpm@12.9.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  images:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        # v0.1.0 → 0.1.0: тег образа — версия без «v». Тег приходит снаружи — только через env
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "не тег версии: $TAG" >&2; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          # amd64 — обычные VPS, arm64 — ARM-серверы (sharp и rolldown есть под обе). Под QEMU
          # идут только prod-зависимости и сборка образа: стадия build — на платформе раннера
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          # Версия установки в образе API: её показывают «Состояние» в админке и averra.sh status
          build-args: AVERRA_VERSION=${{ steps.version.outputs.version }}
          tags: ghcr.io/${{ github.repository_owner }}/averra-${{ matrix.target }}:${{ steps.version.outputs.version }}
          # Метка source привязывает пакет GHCR к репозиторию: со страницы пакета видно, откуда он
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
