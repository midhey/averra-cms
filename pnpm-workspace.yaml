packages:
  - apps/*
  - packages/*

# Одна версия общих зависимостей на весь репозиторий.
# В package.json пакетов вместо версии пишем "catalog:"
catalog:
  '@types/node': ^24.19.1
  hono: ^4.13.13
  typescript: ^6.0.3
  zod: ^4.6.5

# pnpm не ставит версии младше суток (minimumReleaseAge) — защита от взломанных свежих релизов.
# Исключения только поштучно и с версией. Убрать при следующем обновлении зависимостей
minimumReleaseAgeExclude:
  - '@vitejs/plugin-react@6.1.2'

# Перед запуском скриптов не доустанавливать зависимости молча, а только предупредить:
# установку запускаем сами
verifyDepsBeforeRun: warn

# Каким зависимостям можно запускать скрипты при установке.
# Остальные pnpm заблокирует и попросит решить явно
allowBuilds:
  esbuild: true
  sharp: true
