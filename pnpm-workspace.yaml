packages:
  - apps/*
  - packages/*
  - e2e
  - deploy

# Одна версия общих зависимостей на весь репозиторий.
# В package.json пакетов вместо версии пишем "catalog:"
catalog:
  '@astrojs/check': ^0.9.10
  '@fontsource/golos-text': ^5.3.0
  '@types/node': ^24.19.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  astro: ^7.3.5
  happy-dom: ^21.0.3
  hono: ^4.13.13
  postcss: ^8.5.30
  react: ^19.3.0
  react-dom: ^19.3.0
  sass: ^1.105.2
  sharp: ^0.35.5
  tsx: ^4.23.15
  typescript: ^6.0.3
  vitest: ^5.0.3
  zod: ^4.6.5

# pnpm не ставит версии младше суток (minimumReleaseAge) — защита от взломанных свежих релизов.
# Исключение — поштучно и с версией: minimumReleaseAgeExclude: ['пакет@версия']. Сейчас их нет

# Перед запуском скриптов не доустанавливать зависимости молча, а только предупредить:
# установку запускаем сами
verifyDepsBeforeRun: warn

# Каким зависимостям можно запускать скрипты при установке.
# Остальные pnpm заблокирует и попросит решить явно
allowBuilds:
  # Необязательная зависимость sass для его собственного `sass --watch`. Скрипт собирает модуль
  # из исходников только с npm_config_build_from_source, готовые бинарники приходят отдельными
  # пакетами. Нам он не нужен вовсе: за файлами следит Vite
  '@parcel/watcher': false
  esbuild: true
  # Скрипт pnpm только подменяет JS-запускалки нативным бинарником ради скорости.
  # Нам хватает запускалок: корневые скрипты вызывают pnpm на закреплённой Node
  pnpm: false
  sharp: true

# pglite-socket (сервер протокола Postgres поверх PGlite, только для тестов API на настоящем
# драйвере) объявляет расширения PGlite обязательными peer-зависимостями, хотя они нужны лишь тем,
# кто их подключает. Помечаем необязательными, чтобы pnpm не ставил их сам
packageExtensions:
  '@electric-sql/pglite-socket':
    peerDependenciesMeta:
      '@electric-sql/pglite-age': { optional: true }
      '@electric-sql/pglite-pgtap': { optional: true }
      '@electric-sql/pglite-pg_ivm': { optional: true }
      '@electric-sql/pglite-pgvector': { optional: true }
      '@electric-sql/pglite-pg_uuidv7': { optional: true }
      '@electric-sql/pglite-pg_hashids': { optional: true }
      '@electric-sql/pglite-pg_textsearch': { optional: true }
